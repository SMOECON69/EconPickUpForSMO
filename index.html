<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็ครายการแจกของ (ผ้าคาด)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl p-6 md:p-8">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="text-4xl mb-2">📦</div>
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600">ระบบเช็ครายการแจ้งของ</h1>
            <div class="inline-flex items-center gap-2 mt-2 text-sm text-green-600 bg-green-50 px-3 py-1 rounded-full">
                <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
                พร้อมใช้งาน (โหลดข้อมูลเรียบร้อย)
            </div>
        </div>

        <!-- Search Box -->
        <div class="space-y-4">
            <label class="block text-gray-700 font-medium">กรอกรหัสนักศึกษา หรือ ชื่อ-นามสกุล:</label>
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="searchInput" placeholder="เช่น 671610105 หรือ ชื่อ-นามสกุล" 
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700">
                <button onclick="handleSearch()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-xl transition duration-200 shadow-md">
                    ค้นหา
                </button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultContainer" class="mt-6 space-y-4"></div>
    </div>

    <script>
        // แทนที่ด้วย URL ของ Google Apps Script Web App ของคุณ
        const SCRIPT_URL = "YOUR_WEB_APP_URL_HERE";

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultContainer');

            if (!keyword) {
                alert('กรุณากรอกข้อมูลสำหรับค้นหา');
                return;
            }

            container.innerHTML = `<div class="text-center py-4 text-gray-500">กำลังค้นหาข้อมูล...</div>`;

            fetch(`${SCRIPT_URL}?action=search&keyword=${encodeURIComponent(keyword)}`)
                .then(res => res.json())
                .then(response => {
                    if (response.success && response.data.length > 0) {
                        let html = '';
                        response.data.forEach((item, index) => {
                            let isReceived = item.isReceived;
                            html += `
                                <div class="border border-gray-200 rounded-xl p-4 bg-gray-50 space-y-3">
                                    <div class="flex justify-between items-center">
                                        <span class="font-semibold text-gray-800 text-lg">ผลการค้นหาที่ ${index + 1}</span>
                                        <span class="px-3 py-1 text-xs rounded-full ${isReceived ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                                            ${isReceived ? 'มารับของแล้ว' : 'ยังไม่ได้รับของ'}
                                        </span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2 text-sm text-gray-600 bg-white p-3 rounded-lg border">
                            `;
                            
                            for (let key in item) {
                                if (key !== 'isReceived') {
                                    html += `<div><span class="font-medium text-gray-700">${key}:</span> ${item[key]}</div>`;
                                }
                            }

                            html += `</div>`;

                            if (!isReceived) {
                                html += `
                                    <button onclick='claimItem(${JSON.stringify(item)})' 
                                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow">
                                        กดรับผ้าคาด
                                    </button>
                                `;
                            } else {
                                html += `
                                    <button disabled class="w-full bg-gray-300 text-gray-500 font-medium py-2.5 rounded-lg cursor-not-allowed">
                                        รับของไปแล้วเรียบร้อย
                                    </button>
                                `;
                            }

                            html += `</div>`;
                        });
                        container.innerHTML = html;
                    } else {
                        container.innerHTML = `<div class="text-center py-4 text-red-500 font-medium">ไม่พบข้อมูลที่คุณค้นหา กรุณาตรวจสอบใหม่อีกครั้ง</div>`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = `<div class="text-center py-4 text-red-500">เกิดข้อผิดพลาดในการเชื่อมต่อระบบ</div>`;
                });
        }

        function claimItem(itemData) {
            if (!confirm("ยืนยันการกดรับผ้าคาดรายการนี้?")) return;

            const primaryId = Object.values(itemData)[0];

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'claim', id: primaryId, details: itemData })
            })
            .then(res => res.json())
            .then(response => {
                if (response.success) {
                    alert("บันทึกการรับของสำเร็จ!");
                    handleSearch();
