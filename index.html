<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเช็ครายการแจกของพรีออเดอร์</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse สำหรับอ่านไฟล์ CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-4">
    
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-blue-700">📦 ระบบเช็ครายการแจกของ</h1>
      <p class="text-xs text-gray-500" id="dataStatus">🔄 กำลังโหลดข้อมูลจาก Google Sheets...</p>
    </div>
    
    <!-- ช่องค้นหา -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-700">กรอกรหัสนักศึกษา หรือ ชื่อ-นามสกุล:</label>
      <div class="flex gap-2">
        <input type="text" id="searchInput" placeholder="เช่น 671610105 หรือ ชื่นกมล" disabled
               class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100">
        <button onclick="handleSearch()" id="searchBtn" disabled
                class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 active:scale-95 transition disabled:bg-gray-400">
          ค้นหา
        </button>
      </div>
    </div>

    <!-- ข้อมูลผู้สั่งซื้อ -->
    <div id="studentCard" class="hidden bg-blue-50 p-4 rounded-lg border border-blue-200 space-y-1">
      <h2 class="font-semibold text-blue-800 text-base border-b border-blue-200 pb-1 mb-2">👤 ข้อมูลผู้สั่งซื้อ</h2>
      <p class="text-sm"><strong>ชื่อ-นามสกุล:</strong> <span id="stName">-</span></p>
      <p class="text-sm"><strong>รหัสนักศึกษา:</strong> <span id="stId" class="font-mono text-blue-700 font-bold">-</span></p>
      <p class="text-sm"><strong>เบอร์โทร:</strong> <span id="stPhone">-</span></p>
      <p class="text-sm"><strong>ใบเสร็จ:</strong> <span id="stReceipt" class="font-bold text-blue-800">-</span></p>
    </div>

    <!-- รายการสินค้าที่ต้องหยิบ -->
    <div id="itemsContainer" class="hidden space-y-2">
      <div class="flex justify-between items-center">
        <h2 class="font-semibold text-gray-800 text-lg">🛒 รายการที่ต้องหยิบ</h2>
        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-0.5 rounded-full" id="itemCount">0 รายการ</span>
      </div>
      <div id="itemList" class="space-y-2"></div>
    </div>

    <!-- ไม่พบข้อมูล -->
    <div id="notFound" class="hidden text-center text-red-500 py-6 font-medium bg-red-50 rounded-lg border border-red-200">
      ❌ ไม่พบข้อมูลการสั่งซื้อ
    </div>

  </div>

  <script>
    // ลิงก์ Published CSV ของ Google Sheets
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScODA9rW6QK2xV9KnCz4PmLVGeIyBSSwvBj-qX1f325WOAygCgQnge_AUvTtwG_w/pub?output=csv";
    
    let rawData = [];

    // ดึงข้อมูล CSV เมื่อเปิดหน้าเว็บ
    window.onload = function() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          rawData = results.data;
          document.getElementById('dataStatus').innerText = "🟢 พร้อมใช้งาน (โหลดข้อมูลเรียบร้อย)";
          document.getElementById('dataStatus').classList.replace('text-gray-500', 'text-green-600');
          document.getElementById('searchInput').disabled = false;
          document.getElementById('searchBtn').disabled = false;
        },
        error: function(err) {
          document.getElementById('dataStatus').innerText = "🔴 ไม่สามารถโหลดข้อมูลได้ กรุณารีเฟรชหน้าเว็บ";
          document.getElementById('dataStatus').classList.replace('text-gray-500', 'text-red-600');
        }
      });
    };

    function handleSearch() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!keyword) {
        alert('กรุณากรอกรหัสนักศึกษาหรือชื่อ');
        return;
      }

      let studentInfo = null;
      let items = [];
      let receipts = new Set();

      let currentStudentId = "";
      let currentName = "";
      let currentPhone = "";
      let currentReceipt = "";

      // ค้นหาในข้อมูล CSV
      rawData.forEach(row => {
        // ดึงค่าตามชื่อหัวคอลัมน์ใน Sheet
        const rawReceipt = row['เล่มที่/เลขที่ใบเสร็จ'] || row['เลขที่ใบเสร็จ'] || '';
        const rawName = (row['ชื่อ - นามสกุล'] || row['ชื่อ-นามสกุล'] || '').trim();
        const rawStudentId = String(row['รหัสนักศึกษา'] || '').trim();
        const rawPhone = row['เบอร์โทร'] || row['เบอร์โทรศัพท์'] || '';
        
        // จำค่าไว้เผื่อแถวถัดไปเป็นเว้นว่าง (Forward Fill)
        if (rawStudentId !== "") currentStudentId = rawStudentId;
        if (rawName !== "") currentName = rawName;
        if (rawPhone !== "") currentPhone = rawPhone;
        if (rawReceipt !== "") currentReceipt = rawReceipt;

        const itemName = row['รายการ'] || '';
        const size = row['ไซส์'] || '-';
        const qty = parseInt(row['จำนวน'] || '0', 10);

        // เช็คว่ารหัสนักศึกษาหรือชื่อ ตรงกับคำค้นหาหรือไม่
        if (currentStudentId.toLowerCase().includes(keyword) || currentName.toLowerCase().includes(keyword)) {
          if (!studentInfo && (currentStudentId || currentName)) {
            studentInfo = { 
              name: currentName, 
              studentId: currentStudentId, 
              phone: currentPhone 
            };
          }

          if (currentReceipt) {
            receipts.add(currentReceipt);
          }

          // เก็บเฉพาะรายการที่ จำนวน > 0
          if (qty > 0 && itemName !== "") {
            items.push({ itemName, size, qty, receipt: currentReceipt });
          }
        }
      });

      // ซ่อน/แสดง UI
      document.getElementById('studentCard').classList.add('hidden');
      document.getElementById('itemsContainer').classList.add('hidden');
      document.getElementById('notFound').classList.add('hidden');

      if (studentInfo && items.length > 0) {
        // แสดงข้อมูลผู้สั่งซื้อ
        document.getElementById('stName').innerText = studentInfo.name || '-';
        document.getElementById('stId').innerText = studentInfo.studentId || '-';
        document.getElementById('stPhone').innerText = studentInfo.phone || '-';
        document.getElementById('stReceipt').innerText = Array.from(receipts).join(', ') || '-';
        document.getElementById('studentCard').classList.remove('hidden');

        // แสดงรายการที่ต้องหยิบ
        const itemList = document.getElementById('itemList');
        itemList.innerHTML = '';
        document.getElementById('itemCount').innerText = `${items.length} รายการ`;

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = "flex items-center justify-between bg-white p-3.5 rounded-lg border shadow-sm border-gray-200 hover:border-blue-400";
          card.innerHTML = `
            <div>
              <p class="font-bold text-gray-800 text-base">${item.itemName}</p>
              <p class="text-sm text-gray-500">ไซส์: <span class="font-bold text-gray-700 bg-gray-100 px-2 py-0.5 rounded">${item.size}</span> <span class="text-xs text-gray-400 ml-1">(ใบเสร็จ: ${item.receipt})</span></p>
            </div>
            <div class="text-right">
              <span class="text-xl font-bold text-green-600 bg-green-50 px-3 py-1 rounded-lg border border-green-200">x ${item.qty}</span>
            </div>
          `;
          itemList.appendChild(card);
        });

        document.getElementById('itemsContainer').classList.remove('hidden');
      } else {
        document.getElementById('notFound').classList.remove('hidden');
      }
    }

    // กด Enter ในช่องค้นหาได้
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });
  </script>
</body>
</html>
